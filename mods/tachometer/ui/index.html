<style>
  :host { all: initial; }

  .tach {
    position: absolute;
    right: 28px;
    bottom: 28px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, visibility .2s;
  }
  .tach.live { opacity: 1; visibility: visible; }

  svg { display: block; }

  .face { fill: rgba(0, 0, 0, .55); stroke: rgba(255, 255, 255, .18); }

  .tick { stroke: rgba(255, 255, 255, .5); stroke-width: 1.5; }
  .tick.major { stroke: #fff; stroke-width: 2.5; }
  .tick.limit { stroke: #e03b3b; }

  .label { font: 11px/1 "Segoe UI", system-ui, sans-serif;
           fill: rgba(255, 255, 255, .6); text-anchor: middle; }

  .needle { stroke: #e03b3b; stroke-width: 2.5; }
  .hub { fill: #fff; }

  .gear { font: 600 26px/1 "Segoe UI", system-ui, sans-serif; fill: #fff;
          text-anchor: middle; font-variant-numeric: tabular-nums; }
</style>

<div class="tach" id="tach">
  <svg viewBox="0 0 180 180" width="180" height="180">
    <circle class="face" cx="90" cy="90" r="84"></circle>
    <g id="scale"></g>
    <line class="needle" id="needle" x1="90" y1="90" x2="90" y2="24"></line>
    <circle class="hub" cx="90" cy="90" r="3"></circle>
    <text class="gear" x="90" y="128" id="gear">N</text>
  </svg>
</div>

<script>
  const SWEEP = 250;
  const START = -125;
  const ns = 'http://www.w3.org/2000/svg';

  const el = (id) => root.getElementById(id);
  const tach = el('tach');
  const needle = el('needle');

  let max = 8000;
  let redline = 0;

  const angle = (rpm) => START + Math.max(0, Math.min(1, rpm / max)) * SWEEP;

  function drawScale() {
    const g = el('scale');
    while (g.firstChild) g.removeChild(g.firstChild);

    for (let v = 0; v <= max; v += 500) {
      const rad = (angle(v) - 90) * Math.PI / 180;
      const major = v % 1000 === 0;

      const line = document.createElementNS(ns, 'line');
      line.setAttribute('class', 'tick' + (major ? ' major' : '') +
                                 (redline && v >= redline ? ' limit' : ''));
      line.setAttribute('x1', 90 + Math.cos(rad) * (major ? 62 : 68));
      line.setAttribute('y1', 90 + Math.sin(rad) * (major ? 62 : 68));
      line.setAttribute('x2', 90 + Math.cos(rad) * 74);
      line.setAttribute('y2', 90 + Math.sin(rad) * 74);
      g.appendChild(line);

      if (!major) continue;
      const text = document.createElementNS(ns, 'text');
      text.setAttribute('class', 'label');
      text.setAttribute('x', 90 + Math.cos(rad) * 50);
      text.setAttribute('y', 90 + Math.sin(rad) * 50 + 4);
      text.textContent = v / 1000;
      g.appendChild(text);
    }
  }

  // 1 is neutral in this game, 2 is first gear, 0 is reverse.
  function gearText(g) {
    if (g === null || g === undefined) return '-';
    if (g === 0) return 'R';
    if (g <= 1) return 'N';
    return g - 1;
  }

  drawScale();

  speedloader.on('rpm', (d) => {
    tach.classList.add('live');

    const limit = d.redline || 8000;
    if (limit !== redline) {
      redline = limit;
      max = Math.ceil((limit * 1.08) / 1000) * 1000;
      drawScale();
    }

    needle.setAttribute('transform', `rotate(${angle(d.rpm)} 90 90)`);
    el('gear').textContent = gearText(d.gear);
  });

  speedloader.on('idle', () => tach.classList.remove('live'));

  speedloader.send('ready');
</script>
