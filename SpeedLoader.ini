; SpeedLoader - a modding platform for NFS Underground 2
; Sits next to SpeedLoader.asi, in the game's scripts\ folder.

[UI]
; 0 turns Chromium off entirely: mods keep running, with no HTML layer.
Enabled = 1

; Key that hands keyboard and mouse to the UI (and gives them back).
; 0x70 = F1. Any Windows virtual-key works: 0x71 = F2, 0x2D = Insert...
ToggleKey = 0x70

; Page loaded on top of the game. Empty = SpeedLoader\ui\shell.html, which
; mounts each mod's UI. Point this at http://localhost:5173 to develop the UI
; with hot reload.
Url =

; 1 opens Chromium's DevTools in a separate window at startup. Console,
; network and inspector all work - that is the point of the UI being Chromium.
DevTools = 0

; 1 mostra na tela o que os mods escrevem com console.log, no mesmo painel de
; speed.print (canto inferior esquerdo, as linhas desbotam sozinhas). Util
; enquanto se desenvolve um mod; 0 deixa o log so no arquivo.
Console = 1

; 1 replaces CEF's content with a checkerboard. Use it to tell a compositing
; problem (D3D9 hook, texture, blending) apart from a page problem.
TestPattern = 0

[Mods]
; Folder holding one subdirectory per mod, each with its own mod.json.
; Relative to the .asi.
Dir = SpeedLoader\mods

[Hooks]
; Where SpeedLoader attaches to the game's main loop. 0x581470 and 0x581475 are
; two consecutive calls to the same empty stub: NFSU2ExtraOptions uses the
; first and Pops uses the second. Change this if you run all three together.
MainLoopSite = 0x581475
